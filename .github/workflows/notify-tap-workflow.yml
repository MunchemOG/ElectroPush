name: Notify Homebrew Tap on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to notify about'
        required: true
        type: string

jobs:
  notify-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tap update
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          TAP_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${TAP_TOKEN}" \
            https://api.github.com/repos/MunchemOG/homebrew-epsh/dispatches \
            -d "{\"event_type\":\"epsh-release\",\"client_payload\":{\"tag\":\"${TAG}\"}}"
