name: Auto Release on Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-release:
    name: Test and Auto Release
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - name: Download dependencies
        run: go mod download
      
      - name: Verify dependencies
        run: go mod verify
      
      - name: Run tests
        run: go test -v ./...
      
      - name: Run go vet
        run: go vet ./...

      # The Linux and Windows Wi-Fi backends are build-tagged, so a plain vet
      # on macOS never compiles them.
      - name: Vet every target platform
        run: |
          for target in darwin linux windows; do
            echo "vetting GOOS=$target"
            GOOS=$target go vet ./... || exit 1
          done

      - name: Run gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi
      
      - name: Generate version
        id: version
        run: |
          # The series lives in VERSION; the patch counts what has landed since
          # it last changed, so editing that file starts a new series at .0.
          # Merge commits are excluded, or opening the series would immediately
          # spend its .0 on the merge that introduced it.
          SERIES=$(cat VERSION)
          ANCHOR=$(git log -1 --format=%H -- VERSION)
          if [ -n "$ANCHOR" ]; then
            PATCH=$(git rev-list --count --no-merges "${ANCHOR}..HEAD")
          else
            PATCH=$(git rev-list --count --no-merges HEAD)
          fi
          VERSION="${SERIES}.${PATCH}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: v$VERSION"
      
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create tarball for Homebrew
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.VERSION }}
          TARBALL="epsh-${VERSION}.tar.gz"
          
          # Create tarball of source code (excluding .git)
          tar --exclude='.git' --exclude='dist' --exclude='epsh' \
              -czf "dist/${TARBALL}" .
          
          echo "Created tarball: dist/${TARBALL}"
          ls -lh "dist/${TARBALL}"
      
      - name: Calculate SHA256 of tarball
        if: steps.check_tag.outputs.exists == 'false'
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TARBALL="epsh-${VERSION}.tar.gz"
          SHA256=$(shasum -a 256 "dist/${TARBALL}" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"
      
      - name: Build binaries
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p dist/binaries
          
          # macOS Intel
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/binaries/epsh-darwin-amd64
          
          # macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/binaries/epsh-darwin-arm64
          
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/binaries/epsh-linux-amd64
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/binaries/epsh-windows-amd64.exe
          
          # Universal macOS binary
          lipo -create -output dist/binaries/epsh-darwin-universal \
            dist/binaries/epsh-darwin-amd64 \
            dist/binaries/epsh-darwin-arm64
      
      - name: Calculate binary checksums
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cd dist/binaries
          shasum -a 256 epsh-* > SHA256SUMS
          cat SHA256SUMS
      
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          draft: false
          prerelease: false
          files: |
            dist/${{ steps.sha.outputs.tarball }}
            dist/binaries/epsh-darwin-amd64
            dist/binaries/epsh-darwin-arm64
            dist/binaries/epsh-darwin-universal
            dist/binaries/epsh-linux-amd64
            dist/binaries/epsh-windows-amd64.exe
            dist/binaries/SHA256SUMS
          body: |
            ## Epsh v${{ steps.version.outputs.VERSION }}
            
            FTC Robot Deployment Tool - Automated release from main branch.
            
            [!] All tests passed successfully
            
            ---
            
            ## Homebrew Installation
            
            **SHA256 will be calculated and added to this release in a moment...**
            
            Check back in ~30 seconds for the Homebrew formula details.
            
            ---
            
            ## Manual Installation
            
            ### macOS (Homebrew)
            ```bash
            brew tap MunchemOG/homebrew-epsh
            brew install epsh
            ```
            
            ### Manual Binary Installation
            
            Download the appropriate binary for your system:
            
            - **macOS (Universal)**: `epsh-darwin-universal` - Works on both Intel and Apple Silicon
            - **macOS (Intel)**: `epsh-darwin-amd64`
            - **macOS (Apple Silicon)**: `epsh-darwin-arm64`
            - **Linux**: `epsh-linux-amd64`
            - **Windows**: `epsh-windows-amd64.exe`
            
            #### macOS/Linux
            ```bash
            # Download and make executable
            curl -LO https://github.com/MunchemOG/ElectroPush/releases/download/${{ steps.version.outputs.TAG }}/epsh-darwin-universal
            chmod +x epsh-darwin-universal
            sudo mv epsh-darwin-universal /usr/local/bin/epsh
            
            # Verify installation
            epsh help
            ```
            
            #### Windows
            Download `epsh-windows-amd64.exe`, rename to `epsh.exe`, and add to your PATH.
            
            ---
            
            ## What's New
            
            This is an automated release triggered by a push to the main branch.
            - [>] All tests passing
            - [>] Binary checksums verified
            - [>] Ready for Homebrew formula update
            
            ### Quick Start
            ```bash
            epsh                # Full deployment (Wi-Fi + ADB + Gradle)
            epsh dc             # Disconnect ADB only
            epsh exit           # Disconnect and restore Wi-Fi
            epsh profile        # Manage robot profiles
            epsh help           # Show help
            ```
            
            See [README.md](https://github.com/MunchemOG/ElectroPush#readme) for full documentation.
            
            ---
            
            **Commit**: ${{ github.sha }}
            **Branch**: main
            **Triggered by**: @${{ github.actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Calculate GitHub archive SHA256
        if: steps.check_tag.outputs.exists == 'false'
        id: github_sha
        run: |
          TAG=${{ steps.version.outputs.TAG }}
          TARBALL="${{ steps.sha.outputs.tarball }}"
          GITHUB_SHA256="${{ steps.sha.outputs.sha256 }}"
          echo "Using uploaded tarball checksum: $GITHUB_SHA256"
          
          # Update release body with correct SHA256
          gh release edit "${TAG}" --notes-file - <<EOF
          ## Epsh ${{ steps.version.outputs.VERSION }}
          
          FTC Robot Deployment Tool - Automated release from main branch.
          
          [!] All tests passed successfully
          
          ---
          
          ## Homebrew Installation
          
          Update your Homebrew tap formula at https://github.com/MunchemOG/homebrew-epsh with:
          
          \`\`\`ruby
          url "https://github.com/MunchemOG/ElectroPush/releases/download/${TAG}/${TARBALL}"
          sha256 "${GITHUB_SHA256}"
          version "${{ steps.version.outputs.VERSION }}"
          \`\`\`
          
          ### GitHub Archive SHA256 (for Homebrew)
          \`\`\`
          ${GITHUB_SHA256}
          \`\`\`
          
          ---
          
          ## Manual Installation
          
          ### macOS (Homebrew)
          \`\`\`bash
          brew tap MunchemOG/homebrew-epsh
          brew install epsh
          \`\`\`
          
          ### Manual Binary Installation
          
          Download the appropriate binary for your system:
          
          - **macOS (Universal)**: \`epsh-darwin-universal\` - Works on both Intel and Apple Silicon
          - **macOS (Intel)**: \`epsh-darwin-amd64\`
          - **macOS (Apple Silicon)**: \`epsh-darwin-arm64\`
          - **Linux**: \`epsh-linux-amd64\`
          - **Windows**: \`epsh-windows-amd64.exe\`
          
          #### macOS/Linux
          \`\`\`bash
          # Download and make executable
          curl -LO https://github.com/MunchemOG/ElectroPush/releases/download/${TAG}/epsh-darwin-universal
          chmod +x epsh-darwin-universal
          sudo mv epsh-darwin-universal /usr/local/bin/epsh
          
          # Verify installation
          epsh help
          \`\`\`
          
          #### Windows
          Download \`epsh-windows-amd64.exe\`, rename to \`epsh.exe\`, and add to your PATH.
          
          ---
          
          ## What's New
          
          This is an automated release triggered by a push to the main branch.
          - [>] All tests passing
          - [>] Binary checksums verified
          - [>] Ready for Homebrew formula update
          
          ### Quick Start
          \`\`\`bash
          epsh                # Full deployment (Wi-Fi + ADB + Gradle)
          epsh dc             # Disconnect ADB only
          epsh exit           # Disconnect and restore Wi-Fi
          epsh profile        # Manage robot profiles
          epsh help           # Show help
          \`\`\`
          
          See [README.md](https://github.com/MunchemOG/ElectroPush#readme) for full documentation.
          
          ---
          
          **Commit**: ${{ github.sha }}
          **Branch**: main
          **Triggered by**: @${{ github.actor }}
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify Homebrew Tap
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          TAP_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "Notifying Homebrew tap about release ${TAG}"
            curl -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token ${TAP_TOKEN}" \
              https://api.github.com/repos/MunchemOG/homebrew-epsh/dispatches \
              -d "{\"event_type\":\"epsh-release\",\"client_payload\":{\"tag\":\"${TAG}\"}}"
          else
            echo "TAP_UPDATE_TOKEN not set, skipping tap notification"
          fi
